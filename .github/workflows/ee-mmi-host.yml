name: EE MMI host-side validation
on:
  push:
    branches:
      - ps2-ee-mmi
    paths:
      - "arch/mips/**"
      - "test/**"
      - ".github/workflows/ee-mmi-host.yml"
  pull_request:
    paths:
      - "arch/mips/**"
      - "test/**"
      - ".github/workflows/ee-mmi-host.yml"
  workflow_dispatch:

jobs:
  host-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check one-trip scripts and Python syntax
        run: |
          sh -n test/ee-build-matrix.sh
          sh -n test/ee-run-matrix.sh
          python3 -m py_compile test/ee-summarize-results.py
      - name: Exhaustive host Adler-32 recurrence/formula tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -o /tmp/test_mmi_adler_math test/test_mmi_adler32_math.c
          /tmp/test_mmi_adler_math
      - name: Verify opt-in MMI native dispatch routing
        run: sh test/ps2/test-dispatch-selection-host.sh
      - name: CRC32 Chorba polynomial and inverse-model tests
        run: python3 test/gen_mmi_chorba.py
      - name: Verify zero-polynomial GF(2) identities and generated inverse tables
        run: python3 test/ps2/verify_crc_polynomials.py
      - name: CRC32 zero-polynomial host differential tests, O2 and O3
        run: |
          for opt in O2 O3; do
            cc -std=c11 -"$opt" -Wall -Wextra -Werror -DCRC_POLY_HOST_TEST \
              -o /tmp/test_crc_poly_host \
              test/ps2/crc_poly_mmi.c test/ps2/test_crc_poly_host.c
            /tmp/test_crc_poly_host
          done
      - name: Verify rank scope and whole-stream MB/s helpers
        run: sh test/ps2/test_rank_host.sh
      - name: Check generic host CMake build still works
        run: |
          cmake -S . -B build-host -DWITH_GTEST=OFF \
            -DBUILD_TESTING=OFF -DWITH_MMI=OFF
          cmake --build build-host --target zlib-ng
      - name: Cross-target MMI C API syntax with host parser
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -I. -Ibuild-host \
            -DPS2_BENCH_SCREEN -DMIPS_MMI -DMIPS_FEATURES \
            -DMIPS_MMI_ADLER32 -DMIPS_MMI_CHORBA \
            -DDISABLE_RUNTIME_CPU_DETECTION -DMIPS_MMI_COMPARE64 \
            test/bench_mmi_adler32_copy.c test/bench_mmi_chorba_copy.c \
            test/bench_mmi_roundtrip.c test/bench_mmi_slide_hash.c \
            test/bench_mmi_compare256.c \
            arch/mips/chunkset_mmi.c arch/mips/compare256_mmi.c
